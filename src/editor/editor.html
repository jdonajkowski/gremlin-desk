<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:">
  <title>Editor</title>
  <link rel="stylesheet" href="../../node_modules/monaco-editor/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header id="bar">
    <span id="path"></span>
    <span id="status"></span>
    <button id="btn-save" title="Save (Ctrl+S)">Save</button>
    <button id="btn-vscode" title="Open in VS Code at the cursor line">Open in VS Code</button>
  </header>
  <div id="ro-banner" hidden></div>
  <div id="banner" hidden>
    <span>This file changed on disk.</span>
    <button id="btn-reload">Reload</button>
    <button id="btn-keep">Keep my edits</button>
  </div>
  <main id="editor"></main>
  <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="editor.js"></script>
</body>
</html>
