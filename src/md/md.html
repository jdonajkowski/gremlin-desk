<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Rendered Markdown is untrusted: no scripts but ours, images only from disk, data URLs and the web. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https:; font-src 'self' data:">
  <base href="./">
  <title>Markdown</title>
  <link rel="stylesheet" href="md.css">
</head>
<body>
  <header id="bar"><span id="path"></span><button id="btn-reload" title="Read the file again from the other computer" hidden>Reload</button><button id="btn-edit" title="Edit this file">Edit</button><button id="btn-vscode" title="Open in VS Code">Open in VS Code</button></header>
  <article id="doc"></article>
  <script src="../md-render.js"></script>
  <script src="md.js"></script>
</body>
</html>
